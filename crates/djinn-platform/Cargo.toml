[package]
name = "djinn-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# The ksni backend talks D-Bus directly on Linux, so no GTK is needed.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Shutdown", "Win32_System_SystemInformation"] }

[dev-dependencies]
# For the release signing tool (examples/sign.rs).
ed25519-dalek = "2.2"
getrandom = "0.4.3"

[lints]
workspace = true
