[package]
name = "djinn-ai"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Optional local models (downloaded on request, run on the CPU) that listen
# to songs and read descriptions. No web or database code here.
[dependencies]
realfft = "3.5"
thiserror.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tract-onnx = "0.23.9"

[lints]
workspace = true

[dev-dependencies]
djinn-engine = { path = "../djinn-engine" }
