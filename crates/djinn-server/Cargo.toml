[package]
name = "djinn-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "djinn"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2 = "0.6.0"
axum.workspace = true
clap.workspace = true
dirs.workspace = true
djinn-ai = { path = "../djinn-ai" }
djinn-cast = { path = "../djinn-cast" }
djinn-engine = { path = "../djinn-engine" }
djinn-library = { path = "../djinn-library" }
djinn-store = { path = "../djinn-store" }
djinn-platform = { path = "../djinn-platform" }
ed25519-dalek = "2.2"
figment.workspace = true
futures-util = "0.3.34"
getrandom = "0.4.3"
notify = { version = "8.2.1", default-features = false }
open = "5.4.5"
if-addrs = "0.15.0"
qrcode = { version = "0.14", default-features = false, features = ["svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rust-embed.workspace = true
serde.workspace = true
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# The AI reader on a GPU (see djinn-ai); the CPU otherwise.
cuda = ["djinn-ai/cuda"]
metal = ["djinn-ai/metal"]

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
