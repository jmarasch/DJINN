# cargo audit (run in CI). Advisories listed here were reviewed.
[advisories]
ignore = [
    # zip 8.6, still pulled in by candle-core 0.11 (the AI reader). All four
    # are in ZipArchive::extract and ZipStreamReader::extract. candle only
    # reads .npz entries with it (DJINN loads GGUF models), and DJINN's own
    # backups use zip 9. Drop these once candle moves to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # libsqlite3-sys 0.37 (bundled SQLite 3.53), pinned by sqlx-sqlite 0.9.0.
    # CVE-2026-119375: a database file opened together with a crafted -wal
    # file of another page size can return stale memory. DJINN only opens
    # its own database and a restored backup, which is a VACUUM INTO snapshot
    # with no -wal file next to it (backup::swap removes the old one). Drop
    # this once sqlx moves to libsqlite3-sys 0.39.
    "RUSTSEC-2026-0459",
]
