# Answers for Debian's installer on the DJINN install disc. Left to ask:
# the time zone, a login for maintenance, which disk (when there's more
# than one) and the final "erase this disk?" confirmation.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
# The box's name is asked, with djinn suggested: it's how it shows on the
# network (<name>.local) and its name as a node, so two boxes need two names.
d-i netcfg/get_hostname string djinn
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# No root login; the installer asks for a maintenance login with sudo.
d-i passwd/root-login boolean false

d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# The whole disk, one partition. Writing it still asks to confirm. Guided
# partitioning is always "use entire disk" (some_device), never "largest
# free space", which fails beside an old system; old LVM or RAID on the
# disk is cleared with it.
d-i partman-auto/init_automatically_partition select some_device
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm_nooverwrite boolean true

d-i apt-setup/non-free-firmware boolean true
# One disc is all there is.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
tasksel tasksel/first multiselect
# SSH, for maintenance with the login asked for above (home network; root
# can't log in), and Debian's automatic security updates.
d-i pkgsel/include string avahi-daemon alsa-utils ca-certificates sudo openssh-server unattended-upgrades
d-i pkgsel/update-policy select unattended-upgrades
# "Install DJINN with a screen" (djinn_screen=1 from the boot menu) adds the
# kiosk's packages to the same step, which shows progress and retries
# downloads; the last step (kiosk.sh) then only sets the screen up. Keep the
# first six in step with the line above.
d-i preseed/early_command string if grep -qw djinn_screen=1 /proc/cmdline; then debconf-set pkgsel/include "avahi-daemon alsa-utils ca-certificates sudo openssh-server unattended-upgrades cage chromium curl fonts-noto-core fonts-noto-color-emoji libgl1-mesa-dri dbus-user-session"; fi
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# DJINN itself, from the disc, then straight to the first start.
d-i preseed/late_command string sh /cdrom/djinn/late.sh
d-i finish-install/reboot_in_progress note
