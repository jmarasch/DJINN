[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.5"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }

[workspace.lints.clippy]
# Spec section 16: no unwrap()/expect() outside tests (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
