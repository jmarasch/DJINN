name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build,
# sign, and publish a release. See docs/releasing.md.
on:
  push:
    tags: ['v*']
  # A dry run from the Actions tab: builds everything, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      matrix:
        include:
          # Built on Ubuntu 22.04 (glibc 2.35) so it runs on Ubuntu 22.04+,
          # Debian 12+, Fedora, Mint and the like, not only the newest.
          - os: ubuntu-latest
            container: ubuntu:22.04
            asset: djinn-linux-x86_64
            binary: djinn
          - os: windows-latest
            asset: djinn-windows-x86_64.exe
            binary: djinn.exe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Git before checkout, so build.rs can read the commit.
      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libasound2-dev pkg-config xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      # The bare binary is what in-app updates download; people installing
      # for the first time get the tarball or the setup program.
      - name: Name the binary
        shell: bash
        run: |
          mkdir out
          cp target/release/${{ matrix.binary }} out/${{ matrix.asset }}

      - name: Linux download (tarball with install.sh)
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/djinn
          cp target/release/djinn packaging/linux/install.sh packaging/linux/djinn.desktop.in LICENSE.md stage/djinn/
          cp web/public/icon-512.png stage/djinn/djinn.png
          tar czf out/djinn-linux-x86_64.tar.gz -C stage djinn

      - name: Windows setup program
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          # The version comes from the exe (Cargo.toml's).
          & $iscc /Qp packaging\windows\djinn.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\installer\djinn-setup-windows-x86_64.exe out\

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  # The optional GPU pack: the AI reader built for NVIDIA cards plus the
  # CUDA libraries it needs, each file zstd-compressed as
  # gpu-<os>-<arch>.<file>.zst. DJINN downloads it from Admin > AI.
  gpu:
    name: GPU pack ${{ matrix.os }}
    strategy:
      # Let each OS finish, so one failure doesn't hide the other's result.
      fail-fast: false
      matrix:
        include:
          # Both pinned to what CUDA 12.4 supports: NVIDIA has no 12.4
          # packages for the Ubuntu that ubuntu-latest runs, and its nvcc
          # rejects the Visual Studio 2026 on windows-latest. 22.04 also
          # matches the main Linux build's glibc, so the helper runs on the
          # same distros.
          - os: ubuntu-22.04
            prefix: gpu-linux-x86_64
            helper: djinn-gpu
            libs: lib64/libcudart.so.12 lib64/libcublas.so.12 lib64/libcublasLt.so.12 lib64/libcurand.so.10
            # apt names: cuda-<name>-12-4, and the math libraries without
            # the cuda- prefix. driver-dev has the libcuda stub to link with.
            cuda-packages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev", "driver-dev"]'
            lib-packages: '["libcublas", "libcublas-dev", "libcurand", "libcurand-dev"]'
          - os: windows-2022
            prefix: gpu-windows-x86_64
            helper: djinn-gpu.exe
            libs: bin/cudart64_12.dll bin/cublas64_12.dll bin/cublasLt64_12.dll bin/curand64_10.dll
            cuda-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'
            lib-packages: '[]'
    runs-on: ${{ matrix.os }}
    env:
      # No GPU on the runner: build for Ampere and newer (the code is JIT
      # compiled for newer cards). Older cards fall back to the processor.
      # Not Turing (75): candle-kernels 0.11 redefines __hmax_nan and
      # __hmin_nan below 80, which CUDA 12.4's headers already define.
      CUDA_COMPUTE_CAP: 80
    steps:
      - uses: actions/checkout@v4
        with:
          # All tags, to compare with the last release.
          fetch-depth: 0

      # Building the pack takes most of the release (installing CUDA, then
      # nvcc compiling candle's kernels), and it only changes when what it's
      # built from does. .github/scripts/gpu-inputs.py lists that: djinn-ai's
      # files, the packages and features Cargo uses for this build (not
      # test-only ones, nor other crates'), the build profiles, and this
      # job's other steps. When the list is the same for the last release,
      # reuse its pack, checked against its SHA256SUMS.
      - name: Reuse the last release's pack
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view --json tagName --jq .tagName) || { echo "No release to reuse: building"; exit 0; }
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          git worktree add -q ../last "$last"
          if ! now=$("$py" .github/scripts/gpu-inputs.py .) ||
             ! then=$("$py" .github/scripts/gpu-inputs.py ../last); then
            echo "Couldn't compare with $last: building"
            exit 0
          fi
          if [ "$now" != "$then" ]; then
            echo "Changed since $last: building"
            diff <(echo "$then") <(echo "$now") | head -40 || true
            exit 0
          fi
          mkdir out
          gh release download "$last" --dir out --pattern '${{ matrix.prefix }}.*' --pattern SHA256SUMS
          cd out
          expected=$(( 1 + $(echo ${{ matrix.libs }} | wc -w) ))
          if [ "$(ls ${{ matrix.prefix }}.* | wc -l)" -ne "$expected" ] ||
             ! sha256sum -c --ignore-missing SHA256SUMS; then
            echo "$last's pack is missing or damaged: building"
            cd .. && rm -rf out
            exit 0
          fi
          rm SHA256SUMS
          echo "Reusing the pack from $last"
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - uses: Jimver/cuda-toolkit@v0.2.16
        if: steps.reuse.outputs.reused != 'true'
        with:
          cuda: '12.4.0'
          method: network
          sub-packages: ${{ matrix.cuda-packages }}
          non-cuda-sub-packages: ${{ matrix.lib-packages }}

      # nvcc compiles with MSVC's cl.exe, which isn't on the PATH by default.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && steps.reuse.outputs.reused != 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.reuse.outputs.reused != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.reuse.outputs.reused != 'true'

      - run: cargo build --release --locked -p djinn-ai --features cuda --bin djinn-gpu
        if: steps.reuse.outputs.reused != 'true'

      - name: Pack
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          mkdir out
          cp target/release/${{ matrix.helper }} "out/${{ matrix.prefix }}.${{ matrix.helper }}"
          for lib in ${{ matrix.libs }}; do
            cp -L "$CUDA_PATH/$lib" "out/${{ matrix.prefix }}.$(basename "$lib")"
          done
          cd out
          for f in *; do zstd -19 -T0 --rm -q "$f"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefix }}
          path: out/*.zst
          if-no-files-found: error

  publish:
    needs: [build, gpu]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Checksums and signature
        env:
          DJINN_SIGNING_KEY: ${{ secrets.DJINN_SIGNING_KEY }}
        run: |
          # The one-line Linux installer fetches this from the latest release.
          cp packaging/linux/install.sh out/
          cd out
          sha256sum djinn-* gpu-* install.sh > SHA256SUMS
          cat SHA256SUMS
          umask 077
          printf '%s\n' "$DJINN_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          cd ..
          cargo run --release -p djinn-platform --example sign -- "$RUNNER_TEMP/signing.key" out/SHA256SUMS
          rm "$RUNNER_TEMP/signing.key"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # "Which file do I download?" first, then the changes since last time.
        run: >-
          gh release create "$GITHUB_REF_NAME" out/* --title "DJINN ${GITHUB_REF_NAME#v}"
          --notes-file packaging/release-notes.md --generate-notes
