name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build,
# sign, and publish a release. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: djinn-linux-x86_64
            binary: djinn
          - os: windows-latest
            asset: djinn-windows-x86_64.exe
            binary: djinn.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Name the binary
        shell: bash
        run: |
          mkdir out
          cp target/release/${{ matrix.binary }} out/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Checksums and signature
        env:
          DJINN_SIGNING_KEY: ${{ secrets.DJINN_SIGNING_KEY }}
        run: |
          cd out
          sha256sum djinn-* > SHA256SUMS
          cat SHA256SUMS
          umask 077
          printf '%s\n' "$DJINN_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          cd ..
          cargo run --release -p djinn-platform --example sign -- "$RUNNER_TEMP/signing.key" out/SHA256SUMS
          rm "$RUNNER_TEMP/signing.key"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "DJINN ${GITHUB_REF_NAME#v}" --generate-notes
