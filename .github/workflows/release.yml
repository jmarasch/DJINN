name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build,
# sign, and publish a release. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: djinn-linux-x86_64
            binary: djinn
          - os: windows-latest
            asset: djinn-windows-x86_64.exe
            binary: djinn.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      # The bare binary is what in-app updates download; people installing
      # for the first time get the tarball or the setup program.
      - name: Name the binary
        shell: bash
        run: |
          mkdir out
          cp target/release/${{ matrix.binary }} out/${{ matrix.asset }}

      - name: Linux download (tarball with install.sh)
        if: runner.os == 'Linux'
        run: |
          mkdir -p stage/djinn
          cp target/release/djinn packaging/linux/install.sh packaging/linux/djinn.desktop.in LICENSE.md stage/djinn/
          cp web/public/icon-512.png stage/djinn/djinn.png
          tar czf out/djinn-linux-x86_64.tar.gz -C stage djinn

      - name: Windows setup program
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DVersion=$("$env:GITHUB_REF_NAME".TrimStart('v'))" packaging\windows\djinn.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\installer\djinn-setup-windows-x86_64.exe out\

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  # The optional GPU pack: the AI reader built for NVIDIA cards plus the
  # CUDA libraries it needs, each file zstd-compressed as
  # gpu-<os>-<arch>.<file>.zst. DJINN downloads it from Admin > AI.
  gpu:
    name: GPU pack ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            prefix: gpu-linux-x86_64
            helper: djinn-gpu
            libs: lib64/libcudart.so.12 lib64/libcublas.so.12 lib64/libcublasLt.so.12 lib64/libcurand.so.10
          - os: windows-latest
            prefix: gpu-windows-x86_64
            helper: djinn-gpu.exe
            libs: bin/cudart64_12.dll bin/cublas64_12.dll bin/cublasLt64_12.dll bin/curand64_10.dll
    runs-on: ${{ matrix.os }}
    env:
      # No GPU on the runner: build for Turing and newer (the code is JIT
      # compiled for newer cards). Older cards fall back to the processor.
      CUDA_COMPUTE_CAP: 75
    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked -p djinn-ai --features cuda --bin djinn-gpu

      - name: Pack
        shell: bash
        run: |
          mkdir out
          cp target/release/${{ matrix.helper }} "out/${{ matrix.prefix }}.${{ matrix.helper }}"
          for lib in ${{ matrix.libs }}; do
            cp -L "$CUDA_PATH/$lib" "out/${{ matrix.prefix }}.$(basename "$lib")"
          done
          cd out
          for f in *; do zstd -19 -T0 --rm -q "$f"; done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefix }}
          path: out/*.zst
          if-no-files-found: error

  publish:
    needs: [build, gpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Checksums and signature
        env:
          DJINN_SIGNING_KEY: ${{ secrets.DJINN_SIGNING_KEY }}
        run: |
          cd out
          sha256sum djinn-* gpu-* > SHA256SUMS
          cat SHA256SUMS
          umask 077
          printf '%s\n' "$DJINN_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          cd ..
          cargo run --release -p djinn-platform --example sign -- "$RUNNER_TEMP/signing.key" out/SHA256SUMS
          rm "$RUNNER_TEMP/signing.key"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "DJINN ${GITHUB_REF_NAME#v}" --generate-notes
