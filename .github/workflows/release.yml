name: Release

# Push a tag like v2027.01.05 (Cargo version 2027.1.5) to build,
# sign, and publish a stable release from main. Each night, if the dev
# branch changed, the same jobs build it and publish a nightly
# (v2027.01.05-nightly) as a pre-release, which only DJINNs on the nightly
# update channel take. See docs/releasing.md.
on:
  push:
    # Nightly tags are made by this workflow, so they don't start it again.
    tags: ['v*', '!v*-nightly']
  # 08:13 UTC is about 3 AM Eastern in winter and 4 AM in summer; off the
  # hour, since GitHub delays or drops schedules at the top of the hour.
  # GitHub runs this from main's copy of the workflow, whatever branch it
  # builds.
  schedule:
    - cron: '13 8 * * *'
  # From the Actions tab: a dry run (builds everything, publishes nothing),
  # or a nightly right away, built even if dev hasn't changed.
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish a nightly from dev (otherwise a dry run of the chosen branch)
        type: boolean
        default: false

# Every job can read; only publishing can change anything. Actions are pinned
# to commits, since a tag can be moved and what these jobs build gets signed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Where nightlies are built from.
  NIGHTLY_BRANCH: dev

jobs:
  # What this run builds: a stable release (a tag), a nightly (the schedule,
  # or asked for), or a dry run. A scheduled nightly stops here when dev is
  # where the last nightly or stable release already was.
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      # Set only for a nightly: its Cargo version.
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Every branch and tag, to compare dev with the last releases.
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NIGHTLY_ASKED: ${{ inputs.nightly }}
        run: |
          set -euo pipefail
          out() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "Stable release $GITHUB_REF_NAME"
            out build=true publish=true "ref=$GITHUB_SHA" "tag=$GITHUB_REF_NAME"
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$NIGHTLY_ASKED" != true ]; then
            echo "Dry run of $GITHUB_REF_NAME"
            out build=true publish=false "ref=$GITHUB_SHA"
            exit 0
          fi
          if ! ref=$(git rev-parse -q --verify "origin/$NIGHTLY_BRANCH^{commit}"); then
            echo "There's no $NIGHTLY_BRANCH branch: nothing to build"
            out build=false
            exit 0
          fi
          releases=$(gh release list --limit 100 --json tagName,isPrerelease,createdAt)
          newest() { jq -r "[.[] | select($1)] | sort_by(.createdAt) | last | .tagName // \"\"" <<<"$releases"; }
          last_nightly=$(newest '.isPrerelease and (.tagName | endswith("-nightly"))')
          last_stable=$(newest '.isPrerelease | not')
          if [ "$EVENT" = schedule ]; then
            for last in "$last_nightly" "$last_stable"; do
              if [ -n "$last" ] && [ "$(git rev-parse -q --verify "refs/tags/$last^{commit}" || true)" = "$ref" ]; then
                echo "$NIGHTLY_BRANCH hasn't changed since $last: nothing to build"
                out build=false
                exit 0
              fi
            done
          fi
          version="$(TZ=America/New_York date +%Y.%-m.%-d)-nightly"
          tag=$(bash .github/scripts/release-tag.sh "$version")
          echo "Nightly $tag from $NIGHTLY_BRANCH at $ref (last nightly: ${last_nightly:-none})"
          out build=true publish=true "ref=$ref" "tag=$tag" "version=$version" "previous=$last_nightly"

  build:
    name: ${{ matrix.asset }}
    # The server carries the app, so that's built first.
    needs: [plan, android]
    if: needs.plan.outputs.build == 'true'
    strategy:
      matrix:
        include:
          # Built on Ubuntu 22.04 (glibc 2.35) so it runs on Ubuntu 22.04+,
          # Debian 12+, Fedora, Mint and the like, not only the newest.
          - os: ubuntu-latest
            container: ubuntu:22.04
            asset: djinn-linux-x86_64
            binary: djinn
          # Raspberry Pi 3, 4 and 5 (and other 64-bit ARM boxes), built
          # natively on GitHub's ARM runners.
          - os: ubuntu-24.04-arm
            container: ubuntu:22.04
            asset: djinn-linux-aarch64
            binary: djinn
          # Every Raspberry Pi down to the Pi 1 and Zero W (ARMv6), built
          # with cross (Docker) on the regular runner; see Cross.toml.
          - os: ubuntu-latest
            asset: djinn-linux-arm
            binary: djinn
            cross: arm-unknown-linux-gnueabihf
          - os: windows-latest
            asset: djinn-windows-x86_64.exe
            binary: djinn.exe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Git before checkout, so build.rs can read the commit.
      - name: Install build tools
        if: runner.os == 'Linux' && matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libasound2-dev pkg-config xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      # A nightly is numbered by its date (2027.1.5-nightly); nothing is committed.
      - name: Number the nightly
        if: needs.plan.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash .github/scripts/set-version.sh "$VERSION"

      # There's none until the app's signing key is set up (docs/releasing.md),
      # and the server then doesn't offer it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: djinn-go-android
          path: android-dist

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag=$(bash .github/scripts/release-tag.sh)
          if [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match expected $tag"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked

      - name: Cross build
        if: ${{ matrix.cross }}
        env:
          PKG_CONFIG_PATH_arm_unknown_linux_gnueabihf: /usr/lib/arm-linux-gnueabihf/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          cargo install cross --locked --version 0.2.5
          cross build --release --locked --target ${{ matrix.cross }}

      # The bare binary is what in-app updates download; people installing
      # for the first time get the tarball, an image, or the setup program.
      - name: Name the binary
        shell: bash
        run: |
          mkdir out
          dir=target/release
          if [ -n "${{ matrix.cross }}" ]; then dir=target/${{ matrix.cross }}/release; fi
          cp "$dir/${{ matrix.binary }}" out/${{ matrix.asset }}
          echo "BUILT=$dir/${{ matrix.binary }}" >> "$GITHUB_ENV"

      - name: Linux download (tarball with install.sh)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p stage/djinn
          cp "$BUILT" packaging/linux/install.sh packaging/linux/djinn.desktop.in LICENSE.md stage/djinn/
          cp web/public/icon-512.png stage/djinn/djinn.png
          tar czf out/${{ matrix.asset }}.tar.gz -C stage djinn

      - name: Windows setup program
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          # Published installers show the padded release date.
          if ($env:TAG) {
            $version = $env:TAG.TrimStart('v')
            & $iscc /Qp "/DVersion=$version" packaging\windows\djinn.iss
          } else {
            & $iscc /Qp packaging\windows\djinn.iss
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\installer\djinn-setup-windows-x86_64.exe out\

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  # The optional GPU pack: the AI reader built for NVIDIA cards plus the
  # CUDA libraries it needs, each file zstd-compressed as
  # gpu-<os>-<arch>.<file>.zst. DJINN downloads it from Admin > AI.
  gpu:
    name: GPU pack ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      # Let each OS finish, so one failure doesn't hide the other's result.
      fail-fast: false
      matrix:
        include:
          # Both pinned to what CUDA 12.4 supports: NVIDIA has no 12.4
          # packages for the Ubuntu that ubuntu-latest runs, and its nvcc
          # rejects the Visual Studio 2026 on windows-latest. 22.04 also
          # matches the main Linux build's glibc, so the helper runs on the
          # same distros.
          - os: ubuntu-22.04
            prefix: gpu-linux-x86_64
            helper: djinn-gpu
            libs: lib64/libcudart.so.12 lib64/libcublas.so.12 lib64/libcublasLt.so.12 lib64/libcurand.so.10
            # apt names: cuda-<name>-12-4, and the math libraries without
            # the cuda- prefix. driver-dev has the libcuda stub to link with.
            cuda-packages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev", "driver-dev"]'
            lib-packages: '["libcublas", "libcublas-dev", "libcurand", "libcurand-dev"]'
          - os: windows-2022
            prefix: gpu-windows-x86_64
            helper: djinn-gpu.exe
            libs: bin/cudart64_12.dll bin/cublas64_12.dll bin/cublasLt64_12.dll bin/curand64_10.dll
            cuda-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'
            lib-packages: '[]'
    runs-on: ${{ matrix.os }}
    env:
      # No GPU on the runner: build for Ampere and newer (the code is JIT
      # compiled for newer cards). Older cards fall back to the processor.
      # Not Turing (75): candle-kernels 0.11 redefines __hmax_nan and
      # __hmin_nan below 80, which CUDA 12.4's headers already define.
      CUDA_COMPUTE_CAP: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
          # All tags, to compare with the last release.
          fetch-depth: 0

      # Building the pack takes most of the release (installing CUDA, then
      # nvcc compiling candle's kernels), and it only changes when what it's
      # built from does. .github/scripts/gpu-inputs.py lists that: djinn-ai's
      # files, the packages and features Cargo uses for this build (not
      # test-only ones, nor other crates'), the build profiles, and this
      # job's other steps. When the list is the same for the last release
      # (stable or nightly), reuse its pack, checked against its SHA256SUMS.
      - name: Reuse the last release's pack
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty') || true
          if [ -z "$last" ]; then echo "No release to reuse: building"; exit 0; fi
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          git worktree add -q ../last "$last"
          if ! now=$("$py" .github/scripts/gpu-inputs.py .) ||
             ! then=$("$py" .github/scripts/gpu-inputs.py ../last); then
            echo "Couldn't compare with $last: building"
            exit 0
          fi
          if [ "$now" != "$then" ]; then
            echo "Changed since $last: building"
            diff <(echo "$then") <(echo "$now") | head -40 || true
            exit 0
          fi
          mkdir out
          gh release download "$last" --dir out --pattern '${{ matrix.prefix }}.*' --pattern SHA256SUMS
          cd out
          expected=$(( 1 + $(echo ${{ matrix.libs }} | wc -w) ))
          if [ "$(ls ${{ matrix.prefix }}.* | wc -l)" -ne "$expected" ] ||
             ! sha256sum -c --ignore-missing SHA256SUMS; then
            echo "$last's pack is missing or damaged: building"
            cd .. && rm -rf out
            exit 0
          fi
          rm SHA256SUMS
          echo "Reusing the pack from $last"
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - uses: Jimver/cuda-toolkit@9b295696791d75d658d8de64c4a85097ad8abeaf # v0.2.16
        if: steps.reuse.outputs.reused != 'true'
        with:
          cuda: '12.4.0'
          method: network
          sub-packages: ${{ matrix.cuda-packages }}
          non-cuda-sub-packages: ${{ matrix.lib-packages }}

      # nvcc compiles with MSVC's cl.exe, which isn't on the PATH by default.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows' && steps.reuse.outputs.reused != 'true'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.reuse.outputs.reused != 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.reuse.outputs.reused != 'true'

      - run: cargo build --release --locked -p djinn-ai --features cuda --bin djinn-gpu
        if: steps.reuse.outputs.reused != 'true'

      - name: Pack
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          mkdir out
          cp target/release/${{ matrix.helper }} "out/${{ matrix.prefix }}.${{ matrix.helper }}"
          for lib in ${{ matrix.libs }}; do
            cp -L "$CUDA_PATH/$lib" "out/${{ matrix.prefix }}.$(basename "$lib")"
          done
          cd out
          for f in *; do zstd -19 -T0 --rm -q "$f"; done
          ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.prefix }}
          path: out/*.zst
          if-no-files-found: error

  # The Android app. Signed when the release key is set up (docs/releasing.md);
  # without it the release goes out with no APK rather than an unsigned one.
  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.DJINN_ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      # The app reads its version from Cargo.toml.
      - name: Number the nightly
        if: needs.plan.outputs.version != ''
        working-directory: .
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: bash .github/scripts/set-version.sh "$VERSION"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build and sign
        if: env.KEYSTORE_BASE64 != ''
        env:
          DJINN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DJINN_ANDROID_KEYSTORE_PASSWORD }}
          DJINN_ANDROID_KEY_ALIAS: ${{ secrets.DJINN_ANDROID_KEY_ALIAS }}
          DJINN_ANDROID_KEY_PASSWORD: ${{ secrets.DJINN_ANDROID_KEY_PASSWORD }}
        run: |
          export DJINN_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$DJINN_ANDROID_KEYSTORE"
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/djinn-go-android.apk
          rm "$DJINN_ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: djinn-go-android
          path: out/*.apk
          if-no-files-found: error

  # Install images for boxes of their own: a PC install disc and Raspberry
  # Pi images, each with the binary built above (packaging/image).
  images:
    name: Install images
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: djinn-linux-*
          path: bins
          merge-multiple: true
      - name: Build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xorriso cpio
      - name: PC install disc
        run: sh packaging/image/pc/build-iso.sh bins/djinn-linux-x86_64 out/djinn-installer-pc-x86_64.iso
      - name: Raspberry Pi 3, 4, 5
        run: sh packaging/image/pi/build-pi.sh arm64 bins/djinn-linux-aarch64 out/djinn-pi-arm64.img.xz
      - name: Every Raspberry Pi (32-bit)
        run: sh packaging/image/pi/build-pi.sh armhf bins/djinn-linux-arm out/djinn-pi-armhf.img.xz
      - name: Keep only the images
        run: |
          mkdir images
          mv out/djinn-installer-pc-x86_64.iso out/djinn-pi-arm64.img.xz out/djinn-pi-armhf.img.xz images/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: djinn-images
          path: images/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [plan, build, gpu, android, images]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Built before the key is around, so nothing compiling can read it.
      - run: cargo build --release --locked -p djinn-platform --example sign

      - name: Checksums and signature
        env:
          DJINN_SIGNING_KEY: ${{ secrets.DJINN_SIGNING_KEY }}
        run: |
          # The one-line Linux installer fetches this from the latest release.
          cp packaging/linux/install.sh out/
          cd out
          sha256sum djinn-* gpu-* install.sh > SHA256SUMS
          cat SHA256SUMS
          umask 077
          printf '%s\n' "$DJINN_SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          cd ..
          target/release/examples/sign "$RUNNER_TEMP/signing.key" out/SHA256SUMS
          rm "$RUNNER_TEMP/signing.key"

      - name: Publish
        if: needs.plan.outputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        # "Which file do I download?" first, then the changes since last time.
        run: >-
          gh release create "$TAG" out/* --title "DJINN ${TAG#v}"
          --notes-file packaging/release-notes.md --generate-notes

      # A pre-release, so GitHub's "latest" (what stable DJINNs and the
      # one-line Linux install read) stays the last stable release. Notes
      # list the changes since the last nightly. Only the newest few
      # nightlies are kept.
      - name: Publish the nightly
        if: needs.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF: ${{ needs.plan.outputs.ref }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          KEEP: 7
        run: |
          {
            echo "**Nightly build** of the \`$NIGHTLY_BRANCH\` branch: the newest changes, tested less than a stable release."
            echo "DJINN offers it only when Admin > System > Updates is set to the Nightly channel."
            echo "The one-line Linux install gets the latest stable release; for this build, download the tarball."
            echo
            cat packaging/release-notes.md
          } > "$RUNNER_TEMP/notes.md"
          # Built again the same day: replace it.
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          since=()
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$TAG" ]; then since=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" out/* --target "$REF" --prerelease --latest=false \
            --title "DJINN ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${since[@]}"
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease and (.tagName | endswith(\"-nightly\")))] | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" |
            while read -r old; do
              echo "Removing $old"
              gh release delete "$old" --cleanup-tag --yes
            done
